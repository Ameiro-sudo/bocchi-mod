<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bocchi Designer - 界面复刻与材质包导出</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/stage.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark"></span>
    <div class="brand-text">
      <h1>Bocchi <em>Designer</em></h1>
      <span class="sub">材质包制作 · 布局常量与 Java 端同步 (sync/check-layout.py)</span>
    </div>
  </div>
  <span class="h-sep"></span>
  <nav class="tabs">
    <button class="tab active" id="swMisayos">主菜单 · misayos</button>
    <button class="tab" id="swPoulsen">主菜单 · poulsen</button>
    <button class="tab" id="swSplash">加载页</button>
  </nav>
  <span class="sp"></span>
  <button class="btn-ghost" id="btnReplay">重播动画</button>
  <span class="seg" title="预览缩放: 适应窗口 / 100% / 200%">
    <button data-zoom="0" class="on">适应</button>
    <button data-zoom="1">100%</button>
    <button data-zoom="2">200%</button>
  </span>
  <span class="h-sep"></span>
  <button class="btn-pri" id="btnImport" title="导入材质包 zip 或 design.json (也支持直接拖拽)">导入</button>
</header>
<div class="layout">
  <div class="preview-wrap">
    <div id="stageFrame">
    <div id="stageScale">
      <div class="stage" id="stage">
        <div class="splash-bg" id="splashStage" style="display:none">
          <div class="splash-logo" id="splashLogo"><img src="assets/textures/logo.png" alt=""></div>
          <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
          <div class="loading-icon" id="loadingIcon"></div>
          <div class="tap-text" id="tapText">TAP TO START</div>
        </div>

        <div id="misayosStage" data-sel>
          <div class="misayos-bg"></div>
          <div class="m-block m-block1" id="mBlock1" data-sel></div>
          <div class="m-stroke1" id="mStroke1" data-sel></div>
          <div class="m-block m-block3" id="mBlock3"><div class="m-block3-grad"></div><img class="m-watermark" id="mWatermark" src="assets/textures/bocchi.png" alt=""></div>
          <div class="m-dash" id="mDash1" data-sel></div>
          <div class="m-dash" id="mDash2" data-sel></div>
          <div class="m-rectw" id="mRectW" data-sel></div>
          <div class="info-text" id="mInfo"></div>
          <div class="social-phobia" id="mPhobia"></div>
          <div class="title-bocchi" id="mBocchi"></div>
          <div class="title-rock" id="mRock"></div>
          <div class="box-tag" id="mBoxGotoh"></div>
          <div class="box-tag" id="mBoxGirl"></div>
          <div class="m-tachie" id="mTachie" data-sel><img id="mTachieImg" src="assets/textures/bocchi.png" alt=""></div>
          <div class="m-record" id="mRecord" data-sel>
            <div class="edge"></div>
            <div class="disc"></div>
            <div class="white"></div>
            <div class="shine"></div>
            <div class="label"></div>
            <div class="grooves"></div>
            <div class="cover"><img id="mRecordCover" src="assets/textures/bocchi.png" alt=""></div>
            <div class="ring"></div>
          </div>
          <div class="menu-logo" id="mLogo"><img src="assets/textures/logo.png" alt=""></div>
          <div class="menu-panel" id="mPanel" data-sel>
            <div class="border"></div>
            <div class="panel-title" id="pTitle"></div>
            <div class="panel-version" id="pVer"></div>
            <div class="panel-line" id="pLine"></div>
            <div class="panel-branch" id="pBranch"></div>
            <div class="btn" id="pBtnS"><span class="ic"><img src="assets/svgs/single.svg" alt=""></span><span class="txt">SinglePlayer</span></div>
            <div class="btn" id="pBtnM"><span class="ic"><img src="assets/svgs/multi.svg" alt=""></span><span class="txt">MultiPlayer</span></div>
            <div class="btn" id="pBtnO"><span class="ic"><img src="assets/svgs/option.svg" alt=""></span><span class="txt">Options</span></div>
            <div class="btn-icon" id="pBtnLang"><img src="assets/svgs/lang.svg" alt=""></div>
            <div class="btn-icon" id="pBtnQuit"><img src="assets/svgs/quit.svg" alt=""></div>
            <div class="btn" id="pBtnTheme"><span class="ic"><img src="assets/svgs/theme.svg" alt=""></span><span class="txt">POULSEN</span></div>
            <div class="panel-line" id="pFooter"></div>
            <div class="panel-copyright" id="pCopy1"></div>
            <div class="panel-copyright" id="pCopy2"></div>
          </div>
          <div class="dim-mask" id="mDim"></div>
        </div>

        <div id="poulsenStage" style="display:none">
          <div class="poulsen-bg"></div>
          <div class="p-rect p-rect-pink" id="pRectPink"></div>
          <div class="p-rect p-rect-lpink" id="pRectLpink"></div>
          <img class="p-bgimg" id="pBgImg" src="assets/textures/gotoh.png" alt="">
          <div class="p-strip" id="pStrip"></div>
          <div class="p-bigtext" id="pHitoriTop"></div>
          <div class="p-bigtext" id="pHitoriBottom"></div>
          <div class="p-bigtext" id="pGoto1"></div>
          <div class="p-bigtext" id="pGoto2"></div>
          <div class="p-square" id="pSq1"></div>
          <div class="p-square" id="pSq2"></div>
          <div class="p-square" id="pSq3"></div>
          <div class="p-bar" id="pBar"></div>
          <div class="p-whitebox" id="pBoxA"><img id="pBoxAImg" src="assets/textures/gotoh_image_1.png" alt=""></div>
          <div class="p-whitebox" id="pBoxB"><img id="pBoxBImg" src="assets/textures/gotoh_image_2.png" alt=""></div>
          <div class="p-jtext" id="pJName"></div>
          <div class="p-jtext" id="pJKana"></div>
          <div class="p-addinfo" id="pAddInfo">
            <div id="pAdd1"></div>
            <div id="pAdd2"></div>
            <div id="pAdd3"></div>
          </div>
          <div class="p-alias" id="pAlias"><span id="pAliasQ1">&quot;</span><span id="pAliasText"></span><span id="pAliasQ2">&quot;</span></div>
          <div class="p-tachie" id="pTachie"><img src="assets/textures/gotoh.png" alt=""></div>
          <div class="p-dots" id="pDots"></div>
          <div class="p-circle" id="pDot1"></div>
          <div class="p-circle" id="pDot2"></div>
          <div class="p-circle" id="pDot3"></div>
          <div class="menu-logo" id="pLogo"><img src="assets/textures/logo.png" alt=""></div>
          <div class="p-btn" id="pBtnSingle">SinglePlayer</div>
          <div class="p-btn" id="pBtnMulti">MultiPlayer</div>
          <div class="p-btn" id="pBtnOptions">Options</div>
          <div class="p-btn" id="pBtnQuitP">Quit</div>
          <div class="p-btn" id="pBtnMisayos">MISAYOS</div>
        </div>
      </div>
      <div id="selBox">
        <div class="sel-move"></div>
        <i class="h nw" data-h="nw"></i><i class="h n" data-h="n"></i><i class="h ne" data-h="ne"></i>
        <i class="h e" data-h="e"></i><i class="h se" data-h="se"></i><i class="h s" data-h="s"></i>
        <i class="h sw" data-h="sw"></i><i class="h w" data-h="w"></i>
      </div>
    </div>
    </div>
    <div class="status" id="status">主菜单（misayos）1:1 预览 · 1280×720 设计分辨率</div>
  </div>
  <div class="controls" id="controls"></div>
</div>
<input type="file" id="importInput" style="display:none" accept=".zip,.json">
<div id="dropOverlay">松开以导入材质包 (zip / design.json)</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
