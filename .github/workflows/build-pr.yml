# PR 构建门禁: src/** 变更在合并前必须双树构建通过 (不发布, 只验证)
# 发布链路见 build-release.yml (仅 tag/dispatch 触发)
name: build-pr

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build-pr.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-pr.yml"

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build 1.21.5
        working-directory: src/bocchi-1.21.5
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build :neoforge:build --no-daemon

      - name: Build 1.21.1
        working-directory: src/bocchi-1.21.1
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build :neoforge:build --no-daemon